<body>

<div class="container">

<h2>Check Your CSE473 & CSP473 CA Marks (Only of Section - D)</h2>

<select id="courseType" onchange="updateComponents()">
<option value="">Select Type</option>
<option value="theory">Theory CA</option>
<option value="lab">Lab Marks</option>
<option value="midsem">Mid Sem</option>
</select>

<select id="component">
<option value="">Select Component</option>
</select>

<input type="text" id="systemId" placeholder="Enter SYSTEM ID">

<button onclick="getMarks()">Check</button>

<div id="result"></div>

<div class="note">
<b>Note:</b> The marks displayed here are for reference only.  
Please refer to the University Academic Portal for final marks as per official weightage.
</div>

<div class="course-buttons">

<a href="https://www.gcjana.in/courses/shardauniversity/2601/machine-learning/#Course-Feedback" target="_blank">
        <button class="btn-feedback">Course Feedback</button>
</a>  
<a href="https://www.gcjana.in/courses/shardauniversity/2601/machine-learning/" target="_blank">
        <button class="btn-course">Course Page</button>
</a>

<a href="https://www.gcjana.in" target="_blank">
        <button class="btn-instructor">Course Instructor</button>
</a>

</div>

<script>

function updateComponents(){

var type=document.getElementById("courseType").value;
var comp=document.getElementById("component");

comp.innerHTML="<option value=''>Select Component</option>";

if(type=="theory"){
comp.innerHTML+=`<option value="A1">Assignment-1</option>`;
comp.innerHTML+=`<option value="A2">Assignment-2</option>`;
comp.innerHTML+=`<option value="T1">Assessment-1</option>`;
comp.innerHTML+=`<option value="T2">Assessment-2</option>`;
}

if(type=="lab"){
comp.innerHTML+=`<option value="CA">Lab CA (60)</option>`;
comp.innerHTML+=`<option value="CE">Lab CE (60)</option>`;
comp.innerHTML+=`<option value="LAB ESE">Lab ESE (40)</option>`;
}
if(type=="midsem"){
comp.innerHTML+=`<option value="MID">Mid Sem Marks</option>`;
}

}

function getMarks(){

var id=document.getElementById("systemId").value.trim();
var component=document.getElementById("component").value;
var type=document.getElementById("courseType").value;
var resultDiv=document.getElementById("result");

if(id==""||component==""||type==""){
resultDiv.innerHTML="<div class='error'>Please select all fields.</div>";
return;
}

// ============================================================
// GOOGLE SHEET CONFIGURATION
// Each assessment type uses its OWN Google Sheet.
// ============================================================

// IMPORTANT: If you create new Mid Sem or Lab sheets later, change ONLY
// the corresponding URL below. Theory, Lab and Mid Sem remain independent.
const SHEETS = {
    theory: "https://docs.google.com/spreadsheets/d/1OTh-O8M1PGJDCeg2SJE22V8LLKQXETWIcGqNhB5lWc4/gviz/tq?tqx=out:json",
    lab:    "https://docs.google.com/spreadsheets/d/1a0W4vwBtbDDVphS9MJutiWC12_DJpa0WxrBOBHaMiXY/gviz/tq?tqx=out:json",
    midsem: "https://docs.google.com/spreadsheets/d/1p5_2LFB5UG3_SQnxPIYF1vg49VwEHjOSAEt1PJqUECk/gviz/tq?tqx=out:json"
};

var sheetURL = SHEETS[type];

resultDiv.innerHTML="<div class='result-card'>Fetching marks...</div>";

fetch(sheetURL)
.then(response=>{
    if(!response.ok) throw new Error("Unable to access Google Sheet");
    return response.text();
})
.then(text=>{

var json=JSON.parse(text.substr(47).slice(0,-2));
var rows=json.table.rows;
var found=null;

rows.forEach(r=>{
if(r.c[0] && r.c[0].v==id){
found=r;
}
});

if(!found){
resultDiv.innerHTML="<div class='error'>No record found in the selected sheet!</div>";
return;
}

var name=found.c[1]?.v || "";

// Theory sheet columns:
// G (index 6) = Assignment-1 Submission Link
// H (index 7) = Assignment-2 Submission Link
var assignment1Link = found.c[6]?.v || "";
var assignment2Link = found.c[7]?.v || "";

var marks="";
var componentName="";
var submissionLink="";

// 🔹 Correct Mapping (Based on your sheet)

if(component=="A1"){
marks=found.c[2]?.v;
componentName="Assignment-1";
submissionLink=assignment1Link;
}

if(component=="T1"){
marks=found.c[3]?.v;
componentName="Assessment-1";
}

if(component=="A2"){
marks=found.c[4]?.v;
componentName="Assignment-2";
submissionLink=assignment2Link;
}

if(component=="T2"){
marks=found.c[5]?.v;
componentName="Assessment-2";
}

// Lab
if(component=="CA"){
marks=found.c[2]?.v;
componentName="Lab CA";
}
if(component=="CE"){
marks=found.c[3]?.v;
componentName="Lab CE";
}
if(component=="LAB ESE"){
marks=found.c[4]?.v;
componentName="Lab ESE";
}

if(component=="MID"){
marks=found.c[7]?.v;   // Column H
componentName="Mid Sem Exam";
}

if(marks==null){
resultDiv.innerHTML="<div class='error'>Marks not available, Contact to DR. Goapl Chandra Jana.</div>";
return;
}

var maxMarks = 20;
if(component=="CA" || component=="CE") maxMarks = 60;
if(component=="LAB ESE") maxMarks = 40;
if(component=="MID") maxMarks = 30;

var percent = (marks / maxMarks) * 100;

var gradeClass="average";
if(percent>=75) gradeClass="good";
else if(percent<50) gradeClass="low";

resultDiv.innerHTML = `
<div class="result-card">

<b>SYSTEM ID:</b> ${id}<br><br>
<b>STUDENT NAME:</b> ${name}<br><br>

<b>${componentName} Marks:</b> 
<span class="marks-badge ${gradeClass}">
${marks} / ${maxMarks}
</span>

<br><br>

${(submissionLink) ? `
<a href="${submissionLink}" target="_blank" rel="noopener noreferrer">
<button style="background:#28a745;">View Graded Submission</button>
</a>
` : ``}

</div>
`;

})
.catch(error=>{
resultDiv.innerHTML="<div class='error'>Unable to fetch marks. Please check that the selected Google Sheet is shared/published for web access.</div>";
});

}

</script>
